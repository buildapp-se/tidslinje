<!DOCTYPE html>
<!-- Source for /tidslinje/og.png (1200x630). Rendered to public/og.png. -->
<html lang="sv">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:#EFEBE4; color:#1A1A1A;
    display:flex; align-items:center; gap:70px; padding:0 110px;
    font-family:'Fraunces',serif;
  }
  .mark{
    width:264px;height:264px;flex:none;border-radius:52px;background:#B0342B;
    box-shadow:0 2px 4px rgba(26,26,26,.08),0 30px 60px -20px rgba(176,52,43,.45);
    position:relative;
  }
  .mark .t{
    position:absolute; left:66px; bottom:70px;
    font-family:'Archivo',sans-serif; font-weight:800; font-size:150px; color:#fff; line-height:1;
  }
  .mark .dot{position:absolute; right:78px; top:120px; width:34px; height:34px; border-radius:50%; background:#fff}
  .copy{display:flex;flex-direction:column}
  .wordmark{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .wordmark .ser{font-family:'Fraunces',serif;font-weight:600;font-size:78px;letter-spacing:-.02em;color:#1A1A1A}
  .wordmark .san{font-family:'Archivo',sans-serif;font-weight:800;font-size:74px;letter-spacing:.02em;color:#B0342B}
  .rule{display:flex;align-items:center;gap:14px;margin-top:14px}
  .rule .bar{height:8px;width:210px;border-radius:4px;background:#B0342B}
  .rule .rdot{width:16px;height:16px;border-radius:50%;background:#B0342B}
  .tagline{font-family:'Fraunces',serif;font-weight:500;font-size:40px;color:#1A1A1A;opacity:.72;margin-top:30px}
  .url{margin-top:34px;font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;letter-spacing:.04em;color:#B0342B;text-transform:lowercase}
</style>
</head>
<body>
  <div class="mark"><span class="t">T</span><span class="dot"></span></div>
  <div class="copy">
    <div class="wordmark"><span class="ser">Arbetarrörelsens</span><span class="san">TIDSLINJE</span></div>
    <div class="rule"><span class="bar"></span><span class="rdot"></span></div>
    <div class="tagline">Klass, kamp och kompromiss: 1846 till i dag</div>
    <div class="url">buildapp.se/tidslinje</div>
  </div>
</body>
</html>
